aid: vector-launch
name: Vector Launch
description: >-
  Vector Launch, Inc. (originally Vector Space Systems) was an American small-launch and space
  software company founded in February 2016 in Tucson, Arizona by Jim Cantrell — an early SpaceX
  executive — with John Garvey, Shaun Coleman, Ken Sunshine and Eric Besnard. It acquired Garvey
  Spacecraft in July 2016 and developed two LOX/propylene micro-launch vehicles, the Vector-R and
  the larger Vector-H, aimed at a high-cadence smallsat launch market, alongside GalacticSky, a
  San Jose based software-defined-satellite platform that produced more than forty patents and was
  marketed in 2016 with a promised suite of satellite SDKs, APIs and a satellite-optimised Linux
  distribution called GalacticOS. Those developer surfaces were announced but never shipped
  publicly: Vector operated no developer portal, published no OpenAPI, AsyncAPI, GraphQL SDL or
  Postman collection, ran no public GitHub organisation, and distributed no client SDK to any
  package registry. The company raised roughly $22M disclosed (a $1M angel round from Shaun
  Coleman, then $21M in June 2017 from Sequoia Capital, Shasta Ventures and Lightspeed Venture
  Partners), flew suborbital prototypes from Mojave and Spaceport Camden, and won a $3.4M U.S. Air
  Force ASLON-45 mission in August 2019 that was cancelled days later on solvency grounds. Sequoia
  withdrew support in August 2019, Cantrell departed, operations halted, and Vector filed Chapter 11
  in Delaware on 13 December 2019; Lockheed Martin took the GalacticSky assets by default for
  $4.25M when no qualified competing bid appeared, and a separate bidder took the launch-vehicle
  assets. A relaunched entity under Robert Spalding re-emerged on 29 October 2020, shareholders
  voted a wind-down in January 2021, and the residual business was finally absorbed on 26 February
  2026 when Phantom Space — Jim Cantrell's later company — acquired Vector's remaining assets,
  engineering data, tooling and intellectual property to accelerate its Daytona launch vehicle.
  Nothing of Vector's own web presence survives: vector-launch.com is a dormant GoDaddy-registered
  holding domain that fails TLS name validation and returns 404 on every path, and the earlier
  vectorspacesystems.com brand domain lapsed and now redirects off-domain to an unrelated gambling
  site. This profile is retained as a historical record; there is no API surface to enrich.
