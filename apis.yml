  serves nothing: HTTPS fails certificate name validation (curl error 60) and plain HTTP answers 404
  on every path including /, /robots.txt and all /.well-known/* locations. The predecessor brand
  domain vectorspacesystems.com has lapsed and been re-registered by an unrelated party — it now
  302s to https://www.dolar138.com/, an Indonesian gambling site — so it is deliberately NOT wired
  as a Website pointer. galacticsky.com matches the GalacticSky product name but is an unrelated
  third-party site and is not Vector's. See well-known/vector-launch-well-known.yml.
